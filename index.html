<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1f17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />

    <!-- Favicon — full Nature Haven lockup. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Always start at top on refresh. Must run synchronously here (before
      // the deferred module bundle) so the browser skips its own restoration.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
    </script>

    <!-- Pre-React scroll lock — released by the intro overlay or App mount. -->
    <style id="nh-prelock">
      html, body { overflow: hidden !important; height: 100%; }
    </style>

    <!-- Site-wide defaults. Route-specific title/description/canonical are
         applied by usePageMeta and captured into each prerendered route. -->
    <title>Nature Haven | Pet Friendly Apartment in Saimai, Bangkok</title>
    <meta name="description" content="Discover quiet living in Saimai. Pet-friendly apartments with private balconies, modern interiors, Wi-Fi, housekeeping, and a peaceful community designed for everyday comfort." />
    <link rel="canonical" href="https://naturehaven-living.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="lfmViR4_otOKaA708EpvpiDPPb2qI3q9NRWz45VT1TA" />

    <!-- Open Graph defaults; route metadata overrides these during prerender. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nature Haven" />
    <meta property="og:title" content="Nature Haven | Pet Friendly Apartment in Saimai, Bangkok" />
    <meta property="og:description" content="Discover quiet living in Saimai. Pet-friendly apartments with private balconies, modern interiors, Wi-Fi, housekeeping, and a peaceful community designed for everyday comfort." />
    <meta property="og:url" content="https://naturehaven-living.vercel.app/" />
    <meta property="og:image" content="https://naturehaven-living.vercel.app/og-image-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nature Haven — MUJI-inspired apartment in Saimai, Bangkok" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X defaults; route metadata overrides these during prerender. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nature Haven | Pet Friendly Apartment in Saimai, Bangkok" />
    <meta name="twitter:description" content="Discover quiet living in Saimai. Pet-friendly apartments with private balconies, modern interiors, Wi-Fi, housekeeping, and a peaceful community designed for everyday comfort." />
    <meta name="twitter:image" content="https://naturehaven-living.vercel.app/og-image-v2.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

    <!-- WebSite is site-wide. LocalBusiness, ApartmentComplex, FAQPage,
         CollectionPage, and WebPage are injected by route in main.tsx and
         prerendered with the route that actually contains the content. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://naturehaven-living.vercel.app/#website",
      "name": "Nature Haven",
      "alternateName": ["เนเจอร์ เฮเว่น", "Nature Haven Living"],
      "url": "https://naturehaven-living.vercel.app/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
